name: release

# Versions and publishes @saga-sync/{core,client,producer} to npm via Changesets.
#
# Flow (push to master):
#   1. If there are pending changesets in .changeset/, changesets/action opens
#      (or updates) a "Version Packages" PR that runs `changeset version`:
#      bumps package.json versions, writes CHANGELOGs, deletes the changesets.
#   2. When that PR is merged, this workflow runs again; with no changesets left,
#      changesets/action runs the `release` script, which builds and publishes
#      only the packages whose current version isn't already on npm. It also
#      pushes a git tag per published package (e.g. @saga-sync/core@0.2.0).
#
# `workflow_dispatch` runs a publish dry-run so you can preview tarball contents
# without releasing.
#
# Auth: npm Trusted Publishing (OIDC) — no secret needed. `changeset publish`
# shells out to `pnpm publish` (packageManager is pnpm), which performs the OIDC
# token exchange. The scope owner must register this repo + workflow FILE NAME
# (release.yml) as a trusted publisher for each @saga-sync/* package on
# npmjs.com — keep this file named release.yml or the registration must be
# updated to match.
# Token fallback: see the commented lines on the release job.

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and preview without publishing"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the Version Packages PR branch and release tags
  pull-requests: write # open/update the Version Packages PR
  id-token: write # OIDC token exchange for Trusted Publishing auth

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Changesets needs full history to compute the changelog

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (uses the pnpm version pinned in package.json)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Create Version Packages PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm run version # changeset version (bumps + changelogs)
          publish: pnpm run release # pnpm build && changeset publish
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # TOKEN FALLBACK (instead of Trusted Publishing): create a granular
        # automation token with write access to @saga-sync, store it as the
        # NPM_TOKEN repo secret, and add alongside GITHUB_TOKEN above:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # (also add `registry-url: "https://registry.npmjs.org"` to setup-node).

  dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (uses the pnpm version pinned in package.json)
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish dry-run
        run: pnpm -r publish --dry-run --access public --no-git-checks
